<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端自适应：必须保留 viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>个人博客</title>
  <meta name="description" content="一个纯静态的个人博客，访客无需登录即可浏览。">

  <!-- ===================== 样式表 ===================== -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- favicon：用内联 SVG，省掉一个文件；想换成自己的图标，把这里替换成 assets/favicon.ico 即可 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">

  <!-- ===================== 全局基础路径 =====================
       站点根目录是 ./；后台页在 admin/ 目录里，那里会写成 ../
       所有资源路径都基于它拼接，这样无论部署到根目录还是子目录都不用改代码。 -->
  <script>window.__BLOG_BASE__ = './';</script>
</head>

<body>
  <!-- ============ 顶部导航 ============ -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- 站点名：内容来自 data/posts.json 的 site.title -->
      <a class="brand" href="#/">
        <span class="brand-logo" id="brandLogo">日</span>
        <span class="brand-text">
          <strong id="brandTitle">个人博客</strong>
          <small id="brandTagline">记录生活 · 沉淀技术</small>
        </span>
      </a>

      <!-- 导航菜单：右边的外链由 site.links 动态渲染 -->
      <nav class="nav" id="navLinks">
        <a href="#/" data-nav="home">首页</a>
        <!-- 下面是占位，页面加载后会被 site.links 覆盖 -->
      </nav>
    </div>
  </header>

  <!-- ============ 主体内容（由 assets/js/app.js 渲染） ============ -->
  <main class="container" id="app">
    <div class="loading">正在加载…</div>
  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">
        © <span id="year">2026</span> <span id="footerTitle">个人博客</span> ·
        Powered by 纯静态 HTML + CSS + JS
      </p>
      <!-- 后台入口：不想让访客看到这个入口，把 assets/js/config.js 里的 ENABLE_ADMIN_LINK 改成 false -->
      <p class="footer-admin" id="footerAdmin">
        <a href="admin/">站长后台</a>
      </p>
    </div>
  </footer>

  <!-- ===================== 脚本（按顺序加载） =====================
       1. data/posts.js   兜底数据，让你直接双击 index.html 也能看到内容（file:// 下 fetch 会被浏览器拦截）
       2. config.js       站点配置
       3. sha256.js       密码哈希工具（后台用）
       4. markdown.js     Markdown 渲染器
       5. store.js        数据层
       6. app.js          前台路由与页面渲染 -->
  <script src="data/posts.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/sha256.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
